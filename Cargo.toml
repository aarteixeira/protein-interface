[package]
name = "protein-interface"
version = "0.1.3"
edition = "2021"
rust-version = "1.82"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]
test = true

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310"] }
rayon = "1.10"
sc_rs = { path = "vendor/sc-rs", package = "sc-rs" }

[profile.release]
lto = "fat"
codegen-units = 1
